<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#596575"/></marker></defs><rect width="1200" height="720" fill="white"/><text x="55.00" y="52" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="700" text-anchor="start">(a) </text><text x="111.33" y="52" fill="#000000" font-family="SimSun" font-size="29" font-weight="700" text-anchor="start">原作答中的首次偏差</text><text x="670.00" y="52" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="700" text-anchor="start">(b) </text><text x="727.82" y="52" fill="#000000" font-family="SimSun" font-size="29" font-weight="700" text-anchor="start">前序材料尚不充分</text><rect x="64" y="94" width="510" height="385" rx="3" fill="#F0F1F2" stroke="#536570" stroke-width="2"/><rect x="55" y="85" width="510" height="385" rx="3" fill="#F0F5F2" stroke="#536570" stroke-width="2"/><path d="M77,123 L543,123" fill="none" stroke="#596575" stroke-width="2.4"/><rect x="644" y="94" width="510" height="385" rx="3" fill="#F0F1F2" stroke="#536570" stroke-width="2"/><rect x="635" y="85" width="510" height="385" rx="3" fill="#F8F2EA" stroke="#536570" stroke-width="2"/><path d="M657,123 L1123,123" fill="none" stroke="#596575" stroke-width="2.4"/><text x="178.69" y="157" fill="#000000" font-family="SimSun" font-size="29" font-weight="400" text-anchor="start">原题：</text><text x="265.69" y="157" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="400" text-anchor="start">2x + 3 = 11</text><text x="758.69" y="157" fill="#000000" font-family="SimSun" font-size="29" font-weight="400" text-anchor="start">原题：</text><text x="845.69" y="157" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="400" text-anchor="start">2x + 3 = 11</text><text x="110.00" y="230" fill="#000000" font-family="DejaVu Serif" font-size="30" font-weight="400" text-anchor="start">2x = 8</text><text x="377.00" y="230" fill="#000000" font-family="SimSun" font-size="24" font-weight="400" text-anchor="start">前序成立</text><text x="110.00" y="305" fill="#000000" font-family="DejaVu Serif" font-size="30" font-weight="400" text-anchor="start">x = 5</text><text x="365.00" y="305" fill="#000000" font-family="SimSun" font-size="24" font-weight="400" text-anchor="start">解发生变化</text><path d="M99,321 L255,321" stroke="#AC796B" stroke-width="4"/><text x="188.50" y="408" fill="#000000" font-family="SimSun" font-size="27" font-weight="700" text-anchor="start">第二步可确认为首错</text><text x="786.00" y="230" fill="#000000" font-family="SimSun" font-size="26" font-weight="400" text-anchor="start">此前步骤尚未核验</text><text x="773.00" y="305" fill="#000000" font-family="SimSun" font-size="26" font-weight="400" text-anchor="start">后续一步发现不等价</text><text x="752.50" y="408" fill="#000000" font-family="SimSun" font-size="25" font-weight="700" text-anchor="start">保留错误候选，继续核对</text><text x="381.50" y="535" fill="#000000" font-family="SimSun" font-size="29" font-weight="700" text-anchor="start">来源匹配</text><text x="497.50" y="535" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="700" text-anchor="start"> → </text><text x="542.00" y="535" fill="#000000" font-family="SimSun" font-size="29" font-weight="700" text-anchor="start">证据排序</text><text x="658.00" y="535" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="700" text-anchor="start"> → </text><text x="702.50" y="535" fill="#000000" font-family="SimSun" font-size="29" font-weight="700" text-anchor="start">前缀核对</text><text x="349.12" y="590" fill="#000000" font-family="DejaVu Serif" font-size="28" font-weight="400" text-anchor="start">S = I_s + 2I_r + I_f + 0.5I_k − 4I_c</text><text x="337.50" y="659" fill="#000000" font-family="SimSun" font-size="25" font-weight="400" text-anchor="start">排序分比较依据；首错判断还需要此前各步成立</text></svg>