<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#596575"/></marker></defs><rect width="1200" height="720" fill="white"/><text x="55.00" y="52" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="700" text-anchor="start">(a) </text><text x="111.33" y="52" fill="#000000" font-family="SimSun" font-size="29" font-weight="700" text-anchor="start">有效作答与权重</text><text x="55.00" y="108" fill="#000000" font-family="SimSun" font-size="26" font-weight="400" text-anchor="start">来源当前、判定明确、完整作答、未重复</text><text x="55.00" y="153" fill="#000000" font-family="SimSun" font-size="24" font-weight="400" text-anchor="start">局部或失效记录保留原状态；完整答案曝光不作独立证据</text><path d="M55,189 L1145,189" fill="none" stroke="#596575" stroke-width="2.4"/><text x="55.00" y="239" fill="#000000" font-family="DejaVu Serif" font-size="29" font-weight="700" text-anchor="start">(b) </text><text x="112.82" y="239" fill="#000000" font-family="SimSun" font-size="29" font-weight="700" text-anchor="start">同一起点，不同帮助条件</text><text x="55.00" y="308" fill="#000000" font-family="SimSun" font-size="25" font-weight="400" text-anchor="start">独立答对</text><text x="155.00" y="308" fill="#000000" font-family="DejaVu Serif" font-size="25" font-weight="400" text-anchor="start">  w=1</text><path d="M455,300 L1040,300" fill="none" stroke="#596575" stroke-width="2.4"/><rect x="455" y="290" width="534.664845" height="20" rx="0" fill="#93C5B2" stroke="#93C5B2" stroke-width="2"/><circle cx="989.664845" cy="300" r="7" fill="#536570"/><text x="1082.78" y="308" fill="#000000" font-family="DejaVu Serif" font-size="26" font-weight="400" text-anchor="start">0.914</text><text x="55.00" y="386" fill="#000000" font-family="SimSun" font-size="25" font-weight="400" text-anchor="start">提示后答对</text><text x="180.00" y="386" fill="#000000" font-family="DejaVu Serif" font-size="25" font-weight="400" text-anchor="start">  w=0.35</text><path d="M455,378 L1040,378" fill="none" stroke="#596575" stroke-width="2.4"/><rect x="455" y="368" width="355.792905" height="20" rx="0" fill="#B1A0D5" stroke="#B1A0D5" stroke-width="2"/><circle cx="810.792905" cy="378" r="7" fill="#536570"/><text x="1082.78" y="386" fill="#000000" font-family="DejaVu Serif" font-size="26" font-weight="400" text-anchor="start">0.608</text><text x="55.00" y="464" fill="#000000" font-family="SimSun" font-size="25" font-weight="400" text-anchor="start">答案曝光</text><path d="M455,456 L1040,456" fill="none" stroke="#596575" stroke-width="2.4"/><rect x="455" y="446" width="204.75" height="20" rx="0" fill="#A9BFDA" stroke="#A9BFDA" stroke-width="2"/><circle cx="659.75" cy="456" r="7" fill="#536570"/><text x="1082.78" y="464" fill="#000000" font-family="DejaVu Serif" font-size="26" font-weight="400" text-anchor="start">0.350</text><text x="448.00" y="506" fill="#000000" font-family="DejaVu Serif" font-size="22" font-weight="400" text-anchor="start">0</text><text x="1033.00" y="506" fill="#000000" font-family="DejaVu Serif" font-size="22" font-weight="400" text-anchor="start">1</text><text x="684.00" y="506" fill="#000000" font-family="SimSun" font-size="23" font-weight="400" text-anchor="start">掌握估计</text><text x="394.27" y="565" fill="#000000" font-family="DejaVu Serif" font-size="28" font-weight="400" text-anchor="start">p′ = pL₁ʷ / [pL₁ʷ + (1−p)L₀ʷ]</text><text x="366.64" y="613" fill="#000000" font-family="SimSun" font-size="27" font-weight="400" text-anchor="start">答对后：</text><text x="474.64" y="613" fill="#000000" font-family="DejaVu Serif" font-size="27" font-weight="400" text-anchor="start">p″ = p′ + (1−p′)λ min(w,1)</text></svg>