<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#55616a"/></marker></defs><rect width="900" height="700" fill="#ffffff"/><rect x="20" y="20" width="860" height="78" rx="10" fill="#f3f4f3" stroke="#a9b8bf" stroke-width="1.5"/><text x="42" y="53" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="42" dy="0">题目示例：以 72 km/h 匀速行驶 10 s，求路程。</tspan></text><text x="42" y="83" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="42" dy="0">以下是机制示意，不是运行截图或新增测试结果。</tspan></text><rect x="20" y="120" width="270" height="435" rx="12" fill="#eaf3f8" stroke="#a9b8bf" stroke-width="1.5"/><text x="36" y="152" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="36" dy="0">(a) 学生原始作答</tspan></text><text x="39" y="193" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="39" dy="0">步骤 s1</tspan></text><text x="39" y="232" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" text-anchor="start"><tspan x="39" dy="0">s = vt</tspan></text><rect x="37" y="270" width="235" height="130" rx="10" fill="#ffffff" stroke="#a9b8bf" stroke-width="1.5"/><text x="50" y="307" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="50" dy="0">步骤 s2（原文）</tspan></text><text x="50" y="350" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="50" dy="0">72 × 10 = 720 m</tspan></text><text x="39" y="451" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="39" dy="0">实际步骤 ID 与内容</tspan></text><text x="39" y="485" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="39" dy="0">构成定位对象</tspan></text><rect x="315" y="120" width="270" height="435" rx="12" fill="#f3f4f3" stroke="#a9b8bf" stroke-width="1.5"/><text x="331" y="152" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="331" dy="0">(b) 参考资源</tspan></text><text x="334" y="193" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="334" dy="0">先换算速度</tspan></text><text x="334" y="235" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="334" dy="0">72 km/h = 20 m/s</tspan></text><text x="334" y="307" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="334" dy="0">再计算路程</tspan></text><text x="334" y="351" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="334" dy="0">20 × 10 = 200 m</tspan></text><text x="334" y="451" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="334" dy="0">参考第 2 步</tspan></text><text x="334" y="485" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="334" dy="0">不等于学生第 2 步</tspan></text><rect x="610" y="120" width="270" height="435" rx="12" fill="#edf6ef" stroke="#a9b8bf" stroke-width="1.5"/><text x="626" y="152" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="626" dy="0">(c) 定位与证据放大</tspan></text><text x="628" y="193" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="628" dy="0">首次偏差候选：s2</tspan></text><text x="628" y="239" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="628" dy="0">km/h 与 s 未统一</tspan></text><path d="M628,270 L861,270" fill="none" stroke="#55616a" stroke-width="2"/><text x="628" y="307" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">引用：s2 原文 + 版本</tspan></text><text x="628" y="351" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">原因：换算条件遗漏</tspan></text><text x="628" y="414" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="628" dy="0">模型语义建议：待核对</tspan></text><text x="628" y="458" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">学生补充／确认／修正</tspan></text><text x="628" y="500" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">不伪装为符号证明</tspan></text><path d="M272 380 L300 380 L300 580 L745 580 L745 557" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="20" y="615" width="860" height="65" rx="10" fill="#f3f4f3" stroke="#a9b8bf" stroke-width="1.5"/><text x="42" y="655" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="42" dy="0">虚线关联学生 s2 与诊断引用；当前派生诊断随输入变更清除并重建。</tspan></text></svg>