<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#55616a"/></marker></defs><rect width="900" height="700" fill="#ffffff"/><rect x="20" y="20" width="415" height="560" rx="12" fill="#eaf3f8" stroke="#a9b8bf" stroke-width="1.5"/><text x="36" y="52" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="36" dy="0">(a) 业务实体与关联</tspan></text><path d="M43 84 H388 L410 106 V186 H43Z" fill="#ffffff" stroke="#55616a" stroke-width="1.5"/><path d="M388 84 V106 H410" fill="none" stroke="#55616a"/><text x="56" y="119" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="56" dy="0">题目与学生实际作答</tspan></text><text x="56" y="153" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="56" dy="0">题目来源／原图／实际步骤</tspan></text><path d="M43 232 H388 L410 254 V334 H43Z" fill="#ffffff" stroke="#55616a" stroke-width="1.5"/><path d="M388 232 V254 H410" fill="none" stroke="#55616a"/><text x="56" y="267" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="56" dy="0">诊断与持久学习任务</tspan></text><text x="56" y="301" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="56" dy="0">引用题目、作答及来源快照</tspan></text><path d="M43 380 H388 L410 402 V511 H43Z" fill="#ffffff" stroke="#55616a" stroke-width="1.5"/><path d="M388 380 V402 H410" fill="none" stroke="#55616a"/><text x="56" y="415" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="56" dy="0">学习事件与证据记录</tspan></text><text x="56" y="449" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-siz