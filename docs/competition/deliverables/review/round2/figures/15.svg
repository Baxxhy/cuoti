<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#55616a"/></marker></defs><rect width="900" height="720" fill="#ffffff"/><rect x="20" y="20" width="860" height="89" rx="10" fill="#f3f4f3" stroke="#a9b8bf" stroke-width="1.5"/><text x="42" y="56" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="42" dy="0">共同约束：本人实际作答、有效来源与业务资格</tspan></text><text x="42" y="92" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="42" dy="0">各路径按自身合同核对；不能把任务的正确对照门槛套给全部练习。</tspan></text><path d="M155,111 L155,150" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,111 L450,150" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M745,111 L745,150" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="152" width="270" height="424" rx="12" fill="#eaf3f8" stroke="#a9b8bf" stroke-width="1.5"/><text x="36" y="184" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="36" dy="0">(a) 复习</tspan></text><text x="39" y="234" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="39" dy="0">作答 → 判题与反馈</tspan></text><text x="39" y="280" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="39" dy="0">待核对时阻止确定更新</tspan></text><path d="M39,313 L270,313" fill="none" stroke="#55616a" stroke-width="2"/><text x="39" y="356" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="39" dy="0">复习回执与记录</tspan></text><text x="39" y="400" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="39" dy="0">规则间隔／下次计划</tspan></text><text x="39" y="464" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="39" dy="0">可进入有效学习记忆</tspan></text><text x="39" y="513" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="39" dy="0">不直接更新掌握估计</tspan></text><rect x="315" y="152" width="270" height="424" rx="12" fill="#edf6ef" stroke="#a9b8bf" stroke-width="1.5"/><text x="331" y="184" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="331" dy="0">(b) 持久学习任务</tspan></text><text x="334" y="234" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="334" dy="0">可验证的条件对照</tspan></text><text x="334" y="280" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="334" dy="0">独立、正确、未曝光</tspan></text><path d="M334,313 L565,313" fill="none" stroke="#55616a" stroke-width="2"/><text x="334" y="356" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="334" dy="0">answer + contrast</tspan></text><text x="334" y="400" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="334" dy="0">来源有效且尚未应用</tspan></text><text x="334" y="464" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="334" dy="0">限定近迁移正向证据</tspan></text><text x="334" y="513" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="334" dy="0">任务完成本身不足</tspan></text><rect x="610" y="152" width="270" height="424" rx="12" fill="#edf6ef" stroke="#a9b8bf" stroke-width="1.5"/><text x="626" y="184" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="626" dy="0">(c) 独立题库练习</tspan></text><text x="629" y="234" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="629" dy="0">曾提供、内容适配</tspan></text><text x="629" y="280" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="629" dy="0">同题同模式不重复</tspan></text><path d="M629,313 L860,313" fill="none" stroke="#55616a" stroke-width="2"/><text x="629" y="356" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="629" dy="0">判题确认正确或错误</tspan></text><text x="629" y="400" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="629" dy="0">允许 can_update_learning</tspan></text><text x="629" y="464" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="629" dy="0">正向／负向规则证据</tspan></text><text x="629" y="513" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" text-anchor="start"><tspan x="629" dy="0">不保证远迁移能力</tspan></text><path d="M450 578 L450 612 L745 612 L745 578" fill="none" stroke="#55616a" stroke-width="2"/><rect x="315" y="630" width="565" height="65" rx="10" fill="#ffffff" stroke="#a9b8bf" stroke-width="1.5"/><text x="336" y="671" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="336" dy="0">任务／练习 → 仓颉事务保存认知规则估计</tspan></text></svg>