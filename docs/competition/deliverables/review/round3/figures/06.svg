<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#55616a"/></marker></defs><rect width="900" height="730" fill="#ffffff"/><rect x="20" y="20" width="860" height="125" rx="12" fill="#edf6ef" stroke="#a9b8bf" stroke-width="1.5"/><text x="36" y="52" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="36" dy="0">仓颉持久任务协调器</tspan></text><text x="43" y="87" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43" dy="0">租约领取 · 来源快照 · 版本／幂等 · 取消 · 预算 · 提交前复核</tspan></text><text x="43" y="122" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="43" dy="0">持久检查点与事件保留于 MySQL；不是多个自治 Agent 的协商网络。</tspan></text><path d="M160,146 L160,195" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><text x="178" y="178" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="178" dy="0">受控上下文</tspan></text><rect x="20" y="197" width="860" height="365" rx="12" fill="#eaf3f8" stroke="#a9b8bf" stroke-width="1.5"/><text x="36" y="229" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Python 任务计算：一次有界执行</tspan></text><rect x="43" y="254" width="250" height="115" rx="10" fill="#ffffff" stroke="#a9b8bf" stroke-width="1.5"/><text x="59" y="286" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="59" dy="0">观察与规划</tspan></text><text x="59" y="319" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="59" dy="0">读取学生动作与来源</tspan><tspan x="59" dy="27.0">选择阶段和下一工具</tspan></text><rect x="335" y="254" width="250" height="115" rx="10" fill="#ffffff" stroke="#a9b8bf" stroke-width="1.5"/><text x="351" y="286" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="351" dy="0">执行受控工具</tspan></text><text x="351" y="319" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="351" dy="0">判题／检索／图形</tspan><tspan x="351" dy="27.0">手写识别需确认</tspan></text><rect x="627" y="254" width="230" height="115" rx="10" fill="#ffffff" stroke="#a9b8bf" stroke-width="1.5"/><text x="643" y="286" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="643" dy="0">验证与判定</tspan></text><text x="643" y="319" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="643" dy="0">结构／符号／资格</tspan><tspan x="643" dy="27.0">不确定则待核对</tspan></text><path d="M294,307 L333,307" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M586,307 L625,307" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><rect x="150" y="418" width="600" height="94" rx="10" fill="#edf6ef" stroke="#a9b8bf" stroke-width="1.5"/><text x="450" y="453" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle"><tspan x="450" dy="0">检查点：repair → independent → contrast → done</tspan></text><text x="450" y="488" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle"><tspan x="450" dy="0">阶段不等于任务业务状态；支持范围决定可获得的证据。</tspan></text><path d="M741 370 L741 402 L450 402 L450 417" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><path d="M149 464 L85 464 L85 383 L168 383 L168 370" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M750,197 L750,147" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)"/><text x="470" y="179" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="470" dy="0">候选结果回交业务层</tspan></text><rect x="20" y="611" width="860" height="85" rx="10" fill="#f3f4f3" stroke="#a9b8bf" stroke-width="1.5"/><text x="43" y="647" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="43" dy="0">学生反馈</tspan></text><text x="175" y="647" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="175" dy="0">补充过程／作答／确认／继续 → 新版本动作</tspan></text><text x="43" y="679" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="43" dy="0">虚线回路为预算内调整；等待学生时交还控制，不无限自主运行。</tspan></text><path d="M21 648 L9 648 L9 103 L18 103" fill="none" stroke="#55616a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/></svg>