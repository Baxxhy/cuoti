<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img"><title>角色权限边界</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#658092"/></marker><marker id="t" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#168C89"/></marker></defs><rect width="640" height="490" fill="white"/><rect x="28" y="20" width="584" height="50" rx="6" fill="#173B63"/><text x="78" y="51" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="white">身份</text><text x="245" y="51" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="white">可访问范围</text><text x="486" y="51" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="white">服务端准入依据</text><rect x="28" y="82" width="584" height="66" fill="#F2F6FA"/><text x="78" y="121" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#203C53">学生</text><text x="245" y="121" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">本人题目、作答、任务</text><text x="486" y="121" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">当前身份与本人归属</text><path d="M130 90V140" stroke="#D1DEE8"/><path d="M365 90V140" stroke="#D1DEE8"/><rect x="28" y="160" width="584" height="66" fill="#F2F6FA"/><text x="78" y="199" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#203C53">家长</text><text x="245" y="199" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">已关联学生学习摘要</text><text x="486" y="199" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">有效关联关系</text><path d="M130 168V218" stroke="#D1DEE8"/><path d="M365 168V218" stroke="#D1DEE8"/><rect x="28" y="238" width="584" height="66" fill="#F2F6FA"/><text x="78" y="277" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#203C53">教师</text><text x="245" y="277" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">本人班级、作业与复核</text><text x="486" y="277" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">角色与班级归属</text><path d="M130 246V296" stroke="#D1DEE8"/><path d="M365 246V296" stroke="#D1DEE8"/><rect x="28" y="316" width="584" height="66" fill="#F2F6FA"/><text x="78" y="355" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="#203C53">管理员</text><text x="245" y="355" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">受控工作台与审计字段</text><text x="486" y="355" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">专用权限与字段白名单</text><path d="M130 324V374" stroke="#D1DEE8"/><path d="M365 324V374" stroke="#D1DEE8"/><path d="M24 409H616" stroke="#D8E3EC"/><text x="30" y="432" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#658092">内部算法另用服务认证；手机与浏览器不直连 MySQL / 算法服务。</text><text x="30" y="465" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#658092">受控资源仍需校验访问资格；仅知道记录 ID 不能绕过权限。</text></svg>