<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#354452"/></marker></defs><rect width="900" height="700" fill="#ffffff"/><rect x="20" y="20" width="860" height="78" rx="3" fill="#fff0cd" stroke="#8295a3" stroke-width="1.5"/><text x="42" y="53" fill="#000000" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" text-anchor="start"><tspan x="42" dy="0">题目示例：以 72 km/h 匀速行驶 10 s，求路程。</tspan></text><text x="42" y="83" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="42" dy="0">机制示意：定位单位换算错误并核对学生步骤。</tspan></text><rect x="20" y="120" width="270" height="435" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="20" y="120" width="270" height="47" rx="0" fill="#d6eafa" stroke="none" stroke-width="1.5"/><path d="M20 167 V555 H290" stroke="#b8c5cc" stroke-width="1.2" fill="none"/><text x="36" y="152" fill="#000000" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" text-anchor="start"><tspan x="36" dy="0">(a) 学生原始作答</tspan></text><text x="39" y="193" fill="#000000" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start"><tspan x="39" dy="0">步骤 s1</tspan></text><text x="39" y="232" fill="#000000" font-family="Noto Serif CJK SC" font-size="25" font-weight="400" text-anchor="start"><tspan x="39" dy="0">s = vt</tspan></text><path d="M37 270 H250 L272 292 V400 H37Z" fill="#ffffff" stroke="#354452" stroke-width="1.5"/><path d="M250 270 V292 H272" fill="none" stroke="#354452"/><text x="50" y="305" fill="#000000" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start"><tspan x="50" dy="0"></tspan></text><text x="50" y="339" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="50" dy="0"></tspan></text><text x="50" y="307" fill="#000000" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" text-anchor="start"><tspan x="50" dy="0">步骤 s2（原文）</tspan></text><text x="50" y="350" fill="#000000" font-family="Noto Serif CJK SC" font-size="21" font-weight="400" text-anchor="start"><tspan x="50" dy="0">72 × 10 = 720 m</tspan></text><text x="39" y="451" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="39" dy="0">实际步骤 ID 与内容</tspan></text><text x="39" y="485" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="39" dy="0">构成定位对象</tspan></text><rect x="315" y="120" width="270" height="435" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="315" y="120" width="270" height="47" rx="0" fill="#cfece1" stroke="none" stroke-width="1.5"/><path d="M315 167 V555 H585" stroke="#b8c5cc" stroke-width="1.2" fill="none"/><text x="331" y="152" fill="#000000" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" text-anchor="start"><tspan x="331" dy="0">(b) 参考解法</tspan></text><text x="334" y="193" fill="#000000" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start"><tspan x="334" dy="0">先换算速度</tspan></text><text x="334" y="235" fill="#000000" font-family="Noto Serif CJK SC" font-size="20" font-weight="400" text-anchor="start"><tspan x="334" dy="0">72 km/h = 20 m/s</tspan></text><text x="334" y="307" fill="#000000" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start"><tspan x="334" dy="0">再计算路程</tspan></text><text x="334" y="351" fill="#000000" font-family="Noto Serif CJK SC" font-size="20" font-weight="400" text-anchor="start"><tspan x="334" dy="0">20 × 10 = 200 m</tspan></text><text x="334" y="451" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="334" dy="0">参考第 2 步</tspan></text><text x="334" y="485" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="334" dy="0">不等于学生第 2 步</tspan></text><rect x="610" y="120" width="270" height="435" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="610" y="120" width="270" height="47" rx="0" fill="#f8dcc9" stroke="none" stroke-width="1.5"/><path d="M610 167 V555 H880" stroke="#b8c5cc" stroke-width="1.2" fill="none"/><text x="626" y="152" fill="#000000" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" text-anchor="start"><tspan x="626" dy="0">(c) 诊断证据</tspan></text><text x="628" y="193" fill="#000000" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start"><tspan x="628" dy="0">首次偏差候选：s2</tspan></text><text x="628" y="239" fill="#000000" font-family="Noto Serif CJK SC" font-size="19" font-weight="400" text-anchor="start"><tspan x="628" dy="0">km/h 与 s 未统一</tspan></text><path d="M628,270 L861,270" fill="none" stroke="#354452" stroke-width="2"/><text x="628" y="307" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">引用：s2 原文 + 版本</tspan></text><text x="628" y="351" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">原因：换算条件遗漏</tspan></text><text x="628" y="414" fill="#000000" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" text-anchor="start"><tspan x="628" dy="0">模型语义建议：待核对</tspan></text><text x="628" y="458" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">学生补充／确认／修正</tspan></text><text x="628" y="500" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="628" dy="0">证据等级：语义诊断</tspan></text><path d="M272 380 L300 380 L300 580 L745 580 L745 557" fill="none" stroke="#354452" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="20" y="615" width="860" height="65" rx="3" fill="#fff0cd" stroke="#8295a3" stroke-width="1.5"/><text x="42" y="655" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="42" dy="0">虚线关联学生 s2 与诊断引用；当前派生诊断随输入变更清除并重建。</tspan></text></svg>