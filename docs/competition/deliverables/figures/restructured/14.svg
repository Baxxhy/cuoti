one" stroke="#354452" stroke-width="2" marker-end="url(#arrow)"/><path d="M496,208 L724,208" fill="none" stroke="#354452" stroke-width="2" marker-end="url(#arrow)"/><text x="130" y="335" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="130" dy="0">保留原图与实际作答</tspan><tspan x="130" dy="27.0">识别结果支持校正</tspan></text><text x="450" y="335" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="450" dy="0">错因回放与依据核对</tspan><tspan x="450" dy="27.0">修复路线给出下一步</tspan></text><text x="770" y="335" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="770" dy="0">先独立作答再判定</tspan><tspan x="770" dy="27.0">复习保留真实反馈</tspan></text><rect x="20" y="423" width="860" height="133" rx="3" fill="#fff0cd" stroke="#8295a3" stroke-width="1.5"/><text x="42" y="461" fill="#000000" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" text-anchor="start"><tspan x="42" dy="0">跨页面可追溯入口</tspan></text><text x="42" y="504" fill="#000000" font-family="Noto Serif CJK SC" font-size="20" font-weight="400" text-anchor="start"><tspan x="42" dy="0">易错地图 → 对应原题 → 当前诊断／任务／历史记录</tspan></text><text x="42" y="539" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="start"><tspan x="42" dy="0">主操作保持清晰；详细依据进入二级页面，避免首页一次堆叠全部信息。</tspan></text><path d="M770 575 L770 609 L130 609 L130 575" fill="none" stroke="#354452" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="450" y="645" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="450" dy="0">新证据改变后续任务与复习优先级，保留每次更新的来源。</tspan></text></svg>