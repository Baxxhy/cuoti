<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#354452"/></marker></defs><rect width="900" height="590" fill="#ffffff"/><rect x="20" y="25" width="860" height="70" rx="0" fill="#d6eafa" stroke="#8295a3" stroke-width="1.5"/><text x="130.0" y="68" fill="#000000" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" text-anchor="middle"><tspan x="130.0" dy="0">访问对象</tspan></text><text x="318.5" y="68" fill="#000000" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" text-anchor="middle"><tspan x="318.5" dy="0">学生本人</tspan></text><text x="475.5" y="68" fill="#000000" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" text-anchor="middle"><tspan x="475.5" dy="0">教师</tspan></text><text x="632.5" y="68" fill="#000000" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" text-anchor="middle"><tspan x="632.5" dy="0">家长</tspan></text><text x="795.5" y="68" fill="#000000" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" text-anchor="middle"><tspan x="795.5" dy="0">管理操作</tspan></text><rect x="20" y="95" width="860" height="75" rx="0" fill="#ffffff" stroke="#8295a3" stroke-width="1.5"/><text x="130.0" y="140" fill="#000000" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" text-anchor="middle"><tspan x="130.0" dy="0">自己的题目</tspan></text><text x="318.5" y="140" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="318.5" dy="0">本人范围</tspan></text><text x="475.5" y="140" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="475.5" dy="0">班级授权</tspan></text><text x="632.5" y="140" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="632.5" dy="0">报告范围</tspan></text><text x="795.5" y="140" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="795.5" dy="0">受限字段</tspan></text><rect x="20" y="170" width="860" height="75" rx="0" fill="#fff0cd" stroke="#8295a3" stroke-width="1.5"/><text x="130.0" y="215" fill="#000000" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" text-anchor="middle"><tspan x="130.0" dy="0">布置与复核</tspan></text><text x="318.5" y="215" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="318.5" dy="0">参与作业</tspan></text><text x="475.5" y="215" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="475.5" dy="0">所属班级</tspan></text><text x="632.5" y="215" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="632.5" dy="0">不代替复核</tspan></text><text x="795.5" y="215" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="795.5" dy="0">受限管理</tspan></text><rect x="20" y="245" width="860" height="75" rx="0" fill="#ffffff" stroke="#8295a3" stroke-width="1.5"/><text x="130.0" y="290" fill="#000000" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" text-anchor="middle"><tspan x="130.0" dy="0">学习报告</tspan></text><text x="318.5" y="290" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="318.5" dy="0">本人查看</tspan></text><text x="475.5" y="290" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="475.5" dy="0">班级范围</tspan></text><text x="632.5" y="290" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="632.5" dy="0">学生授权</tspan></text><text x="795.5" y="290" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="795.5" dy="0">受限字段</tspan></text><rect x="20" y="320" width="860" height="75" rx="0" fill="#fff0cd" stroke="#8295a3" stroke-width="1.5"/><text x="130.0" y="365" fill="#000000" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" text-anchor="middle"><tspan x="130.0" dy="0">授权撤回</tspan></text><text x="318.5" y="365" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="318.5" dy="0">可撤回</tspan></text><text x="475.5" y="365" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="475.5" dy="0">不扩大范围</tspan></text><text x="632.5" y="365" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="632.5" dy="0">可撤回</tspan></text><text x="795.5" y="365" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="795.5" dy="0">不可绕过</tspan></text><rect x="20" y="395" width="860" height="75" rx="0" fill="#ffffff" stroke="#8295a3" stroke-width="1.5"/><text x="130.0" y="440" fill="#000000" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" text-anchor="middle"><tspan x="130.0" dy="0">原始材料</tspan></text><text x="318.5" y="440" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="318.5" dy="0">归属校验</tspan></text><text x="475.5" y="440" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="475.5" dy="0">任务范围</tspan></text><text x="632.5" y="440" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="632.5" dy="0">不默认开放</tspan></text><text x="795.5" y="440" fill="#000000" font-family="Noto Serif CJK SC" font-size="18" font-weight="400" text-anchor="middle"><tspan x="795.5" dy="0">媒体校验</tspan></text><path d="M20,25 L20,470" fill="none" stroke="#354452" stroke-width="2"/>