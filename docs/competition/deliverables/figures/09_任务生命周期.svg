<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img"><title>任务生命周期</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#658092"/></marker><marker id="t" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#168C89"/></marker></defs><rect width="640" height="650" fill="white"/><ellipse cx="158.0" cy="61.0" rx="122.0" ry="31.0" fill="#E8F5F1" stroke="#70B9AE" stroke-width="1.2"/><text x="158.0" y="66.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">排队 queued</text><rect x="360" y="30" width="244" height="62" rx="7" fill="#173B63" stroke="#173B63" stroke-width="1.2"/><text x="482.0" y="66.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="white">执行 running</text><path d="M280,61.0 L360,61.0" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><rect x="302.0" y="40" width="36" height="19" rx="3" fill="white"/><text x="320" y="54" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#203C53">领取</text><ellipse cx="158.0" cy="215.0" rx="122.0" ry="35.0" fill="#E8F5F1" stroke="#70B9AE" stroke-width="1.2"/><text x="158.0" y="209.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">等待学生</text><text x="158.0" y="230.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">waiting_student</text><ellipse cx="482.0" cy="215.0" rx="122.0" ry="35.0" fill="#E8F5F1" stroke="#70B9AE" stroke-width="1.2"/><text x="482.0" y="209.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">待核对</text><text x="482.0" y="230.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">needs_review</text><path d="M482.0,92 L482,130 L158,130 L158.0,180" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><path d="M482.0,92 L482.0,180" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><path d="M36,215.0 L18,215 L18,61 L36,61.0" fill="none" stroke="#168C89" stroke-width="1.5" marker-end="url(#t)" stroke-dasharray="5 4"/><text x="100" y="116" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#203C53">有效动作后重新排队</text><path d="M604,215.0 L625,215 L625,12 L158,12 L158.0,30" fill="none" stroke="#168C89" stroke-width="1.5" marker-end="url(#t)" stroke-dasharray="5 4"/><ellipse cx="158.0" cy="367.0" rx="122.0" ry="32.0" fill="#E8F5F1" stroke="#70B9AE" stroke-width="1.2"/><text x="158.0" y="372.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">完成 completed</text><ellipse cx="482.0" cy="367.0" rx="122.0" ry="32.0" fill="#FFFFFF" stroke="#B9CBD8" stroke-width="1.2"/><text x="482.0" y="372.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">失败 failed</text><path d="M482.0,92 L320,113 L320,300 L158,300 L158.0,335" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><path d="M604,61.0 L615,61 L615,367 L604,367.0" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><rect x="22" y="444" width="596" height="176" rx="10" fill="#F2F6FA" stroke="#D8E3EC"/><text x="36" y="469" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#173B63">异常与终止规则：保持历史，不允许迟到结果写入</text><text x="40" y="490" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">• failed：仅在允许恢复且预算未耗尽时回到 queued。</text><text x="40" y="521" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">• 活跃 / 可重试任务：主动结束 → cancelled。</text><text x="40" y="552" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">• 除 cancelled / stale 外，来源变更 → stale。</text><text x="40" y="583" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">• running 租约过期可重新领取；完成不等于掌握。</text></svg>