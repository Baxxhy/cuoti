<svg xmlns="http://www.w3.org/2000/svg" width="640" height="625" viewBox="0 0 640 625" role="img"><title>手机交付路线</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#658092"/></marker><marker id="t" markerWidth="7" markerHeight="7" refX="6.3" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#168C89"/></marker></defs><rect width="640" height="625" fill="white"/><rect x="40" y="18" width="560" height="68" rx="7" fill="#173B63" stroke="#173B63" stroke-width="1.2"/><text x="320.0" y="46.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="white">当前已验证基础</text><text x="320.0" y="67.5" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="600" fill="white">uni-app 工程、H5 运行、App 本地资源构建</text><rect x="20" y="126" width="600" height="405" rx="10" fill="#F2F6FA" stroke="#D8E3EC" stroke-dasharray="6 4"/><text x="34" y="151" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#173B63">后续手机交付路线（规划）</text><rect x="44" y="179" width="250" height="86" rx="7" fill="#FFFFFF" stroke="#B9CBD8" stroke-width="1.2"/><text x="169.0" y="206.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">01 发行准备</text><text x="169.0" y="227.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">AppID、包标识</text><text x="169.0" y="248.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">可达 HTTPS 业务地址</text><rect x="348" y="179" width="250" height="86" rx="7" fill="#FFFFFF" stroke="#B9CBD8" stroke-width="1.2"/><text x="473.0" y="206.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">02 设备联调</text><text x="473.0" y="227.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">相机、权限、公式</text><text x="473.0" y="248.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">文件与任务恢复</text><path d="M320.0,86 L320,108 L169,108 L169.0,179" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><path d="M294,222.0 L348,222.0" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><rect x="348" y="360" width="250" height="86" rx="7" fill="#E8F5F1" stroke="#70B9AE" stroke-width="1.2"/><text x="473.0" y="387.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">03 分平台签名安装</text><text x="473.0" y="408.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">Android / iOS</text><text x="473.0" y="429.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">分别产出与验证</text><rect x="44" y="360" width="250" height="86" rx="7" fill="#E8F5F1" stroke="#70B9AE" stroke-width="1.2"/><text x="169.0" y="387.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">04 独立验收与维护</text><text x="169.0" y="408.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">设备记录、升级保留</text><text x="169.0" y="429.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#203C53">数据与版本回归</text><path d="M473.0,265 L473.0,360" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><path d="M348,403.0 L294,403.0" fill="none" stroke="#658092" stroke-width="1.5" marker-end="url(#a)"/><text x="40" y="500" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#203C53">前置条件：签名材料、开发者账户、测试设备。</text><path d="M24 565H616" stroke="#D8E3EC"/><text x="30" y="588" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#658092">资源构建不等于 APK / IPA；服务端继续承担模型计算与业务数据。</text></svg>