[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minddimension-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncmy>=0.2.10",
  "alembic>=1.14",
  "httpx[socks]>=0.28",
  "python-multipart>=0.0.20",
  "pillow>=11.0",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "sympy>=1.13",
  "networkx>=3.4",
  "langgraph>=0.4",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "edge-tts==7.3.1",
  "faster-whisper==1.2.1",
  "qdrant-client>=1.15,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "mypy>=1.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "E741"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# These modules predate the current typing baseline. Keep new modules strict while the
# existing OCR/tutor pipeline is migrated incrementally.
[[tool.mypy.overrides]]
module = [
  "app.main",
  "app.schemas",
  "app.services.ocr_fusion",
  "app.services.personal_knowledge_graph",
  "app.services.tutor_activities",
  "app.services.variants",
]
ignore_errors = true
