[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuoti-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2", "PyMySQL>=1.1,<2",
  "python-dotenv>=1,<2", "cuotibang-algorithms==0.1.0",
  "httpx>=0.28,<1", "python-multipart>=0.0.20", "Pillow>=11.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["cuoti_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: explicitly enabled local MySQL integration check"]

[tool.setuptools.package-data]
cuoti_backend = ["resources/*.json", "resources/schema/*.sql"]
