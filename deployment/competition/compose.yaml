name: cuoti-compose
services:
  qdrant:
    image: cuoti-qdrant:20261023
    volumes: [index:/qdrant/storage]
    restart: unless-stopped
  app:
    image: cuoti-submission:20261023
    env_file: .env
    environment:
      CANGJIE_QDRANT_URL: http://qdrant:6333
    ports: ["127.0.0.1:5175:8080"]
    volumes: [data:/data]
    depends_on: [qdrant]
    restart: unless-stopped
volumes:
  data: {}
  index: {}
