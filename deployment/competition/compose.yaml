name: cuoti-compose
services:
  qdrant:
    image: cuoti-qdrant:20261023
    volumes: [index:/qdrant/storage]
    restart: unless-stopped
  app:
    image: ${CUOTI_IMAGE:-cuoti-python:20261117}
    env_file: .env
    environment:
      CUOTI_QDRANT_URL: http://qdrant:6333
    ports: ["127.0.0.1:5175:8080"]
    volumes: [data:/data]
    depends_on: [qdrant]
    restart: unless-stopped
    stop_grace_period: 120s
volumes:
  data: {}
  index: {}
