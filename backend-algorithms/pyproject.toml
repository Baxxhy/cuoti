[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuotibang-algorithms"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "httpx[socks]>=0.28",
  "python-multipart>=0.0.20",
  "pillow>=11.0",
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "sympy>=1.13",
  "langgraph>=0.4",
  "reportlab>=4.2",
  "openpyxl>=3.1",
  "edge-tts==7.3.1",
  "faster-whisper==1.2.1",
  "qdrant-client>=1.15,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E702", "E741"]

[tool.setuptools.packages.find]
where = ["."]
include = ["learning_core*"]


[tool.setuptools]
py-modules = ["adaptive_practice", "agent_compute", "diagnosis_alignment", "diagnosis_compute", "dialogue_compute", "error_diagnosis", "figure_review", "grading_compute", "grounded_knowledge", "inequality_compute", "knowledge_lesson_compute", "learning_hint_compute", "learning_memory_compute", "learning_planner", "learning_task_compute", "learning_workflow", "mastery_tracker", "paper_export_compute", "practice_alignment", "practice_generation", "retrieval_compute", "service", "task_visualization_compute", "variant_compute", "voice_compute"]
